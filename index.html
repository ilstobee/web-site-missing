<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="missing! — найди себя и команду для совместных дел, проектов, путешествий и хобби."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>missing! — найди себя, найди команду</title>
    <script>
      try {
        if (localStorage.getItem('missing_theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <style>
        #boot-splash {
          position: fixed;
          inset: 0;
          z-index: 2147483000;
          display: grid;
          place-items: center;
          background: var(--splash-bg, #fff);
        }
        #boot-splash .boot-spinner {
          width: 64px;
          height: 64px;
          border-radius: 9999px;
          border: 5px solid var(--splash-ring, #fde7ea);
          border-top-color: #f7566d;
          animation: boot-spin 0.9s linear infinite;
        }
        html.dark {
          --splash-bg: #000;
          --splash-ring: rgba(247, 86, 109, 0.25);
        }
        @keyframes boot-spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
      <div class="boot-spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
